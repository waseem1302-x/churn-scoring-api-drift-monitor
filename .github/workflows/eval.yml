name: Eval gate

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Train all configurations
        run: python -m scripts.train
      - name: Measure latency
        env:
          CHURN_API_KEY: test-key
        run: python -m scripts.measure_latency
      - name: Drift injection experiments
        run: python -m scripts.drift_experiments
      - name: Retraining loop
        run: python -m scripts.retrain
      - name: Evidently drift reports
        run: python -m scripts.evidently_report
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: CI gate
        run: python -m scripts.ci_gate
